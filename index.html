<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yachay Wasi — Historias que tejen comunidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1B2A4A;
    --night-soft:#2C3F66;
    --gold:#D9A441;
    --gold-soft:#F0CE84;
    --clay:#B54834;
    --green:#3F5C44;
    --paper:#F7F0DD;
    --paper-dim:#EFE4C8;
    --ink:#2B241C;
    --ink-soft:#5A5142;
    --radius:14px;
    --shadow: 0 8px 24px rgba(27,42,74,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .kw-root{
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
  }
  .kw-root h1, .kw-root h2, .kw-root h3, .kw-root .kw-display{
    font-family:'Fraunces', serif;
  }

  /* ---------- Header ---------- */
  .kw-header{
    background: linear-gradient(180deg, var(--night) 0%, var(--night-soft) 100%);
    color:var(--paper);
    padding:36px 20px 0 20px;
    position:relative;
    overflow:hidden;
  }
  .kw-header-inner{
    max-width:960px;
    margin:0 auto;
    text-align:center;
    padding-bottom:28px;
  }
  .kw-logo-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:6px;
  }
  .kw-chakana{
    width:30px;height:30px;
    color:var(--gold);
  }
  .kw-brand{
    font-size:clamp(2.2rem, 6vw, 3.2rem);
    font-weight:700;
    letter-spacing:0.5px;
    margin:0;
    color:var(--paper);
  }
  .kw-slogan{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    color:var(--gold-soft);
    font-size:clamp(1rem, 2.4vw, 1.25rem);
    margin:6px 0 0 0;
  }
  .kw-thread{
    display:block;
    width:100%;
    height:34px;
  }

  /* ---------- Nav ---------- */
  .kw-nav{
    max-width:960px;
    margin:-1px auto 0 auto;
    display:flex;
    justify-content:center;
    gap:8px;
    padding:0 20px;
    transform:translateY(-18px);
  }
  .kw-tab{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    background:var(--paper);
    color:var(--night);
    border:2px solid var(--night);
    padding:12px 22px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .kw-tab:hover{ transform:translateY(-2px); }
  .kw-tab.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }

  .kw-main{
    max-width:960px;
    margin:0 auto;
    padding:20px 20px 80px 20px;
  }
  .kw-section{ display:none; animation:kwFade .35s ease; }
  .kw-section.visible{ display:block; }
  @keyframes kwFade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .kw-section-head{ margin-bottom:18px; }
  .kw-section-head h2{
    font-size:1.6rem;
    margin:0 0 6px 0;
    color:var(--night);
  }
  .kw-section-head p{
    margin:0;
    color:var(--ink-soft);
    line-height:1.5;
    max-width:640px;
  }

  /* ---------- Community board ---------- */
  .kw-card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:20px;
    border:1px solid rgba(27,42,74,0.06);
  }
  .kw-field{ margin-bottom:14px; }
  .kw-field label{
    display:block;
    font-weight:600;
    font-size:0.88rem;
    margin-bottom:6px;
    color:var(--night);
  }
  .kw-field input, .kw-field select, .kw-field textarea{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid #DDD3B6;
    background:var(--paper);
    color:var(--ink);
    resize:vertical;
  }
  .kw-field input:focus, .kw-field select:focus, .kw-field textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .kw-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .kw-row .kw-field{ flex:1; min-width:180px; }

  .kw-btn{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    border:none;
    border-radius:999px;
    padding:11px 20px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .kw-btn:hover{ transform:translateY(-1px); filter:brightness(1.05); }
  .kw-btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .kw-btn-primary{ background:var(--clay); color:#fff; }
  .kw-btn-ghost{ background:transparent; color:var(--night); border:1.5px solid var(--night); }
  .kw-btn-gold{ background:var(--gold); color:var(--night); }
  .kw-btn[disabled]{ opacity:0.55; cursor:not-allowed; transform:none; }

  .kw-ai-box{
    background:var(--paper-dim);
    border-left:4px solid var(--gold);
    border-radius:8px;
    padding:12px 14px;
    margin-top:10px;
    font-size:0.9rem;
    line-height:1.5;
    display:none;
    white-space:pre-wrap;
  }
  .kw-ai-box.visible{ display:block; }
  .kw-ai-loading{ color:var(--ink-soft); font-style:italic; }

  .kw-posts{ display:grid; gap:16px; }
  .kw-post{
    background:#fff;
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    border-top:4px solid var(--gold);
  }
  .kw-post-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .kw-tag{
    background:var(--night);
    color:var(--paper);
    padding:3px 10px;
    border-radius:999px;
    font-size:0.72rem;
    font-weight:600;
  }
  .kw-post h3{ margin:0 0 8px 0; font-size:1.15rem; color:var(--night); }
  .kw-post p{ margin:0; line-height:1.6; color:var(--ink); white-space:pre-wrap; }

  /* ---------- Story library ---------- */
  .kw-story-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }
  .kw-story-card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(27,42,74,0.06);
    transition:transform .15s ease;
  }
  .kw-story-card:hover{ transform:translateY(-3px); }
  .kw-story-top{
    height:86px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.1rem;
  }
  .kw-story-body{ padding:16px; }
  .kw-story-body h3{ margin:0 0 6px 0; font-size:1.1rem; color:var(--night); }
  .kw-story-body p{ margin:0 0 10px 0; font-size:0.88rem; color:var(--ink-soft); line-height:1.5; }
  .kw-level{
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--clay);
  }

  /* ---------- Reader ---------- */
  .kw-reader{ display:none; }
  .kw-reader.visible{ display:block; }
  .kw-reader-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .kw-thread-progress{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0 auto 22px auto;
    max-width:420px;
  }
  .kw-thread-dot{
    width:16px; height:16px;
    border-radius:50%;
    background:#DDD3B6;
    border:2px solid #DDD3B6;
    flex-shrink:0;
    transition:background .2s, border-color .2s;
  }
  .kw-thread-dot.done{ background:var(--green); border-color:var(--green); }
  .kw-thread-dot.current{ background:var(--gold); border-color:var(--clay); box-shadow:0 0 0 4px rgba(217,164,65,0.25); }
  .kw-thread-line{ flex:1; height:3px; background:#DDD3B6; border-radius:2px; }
  .kw-thread-line.done{ background:var
